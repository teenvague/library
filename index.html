<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reading Log</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="view-toggle" aria-label="View options">
    <button class="toggle-button" id="entryToggle" aria-label="Entry view" title="Entry view">
      <span class="entry-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <button class="toggle-button" id="gridToggle" aria-label="Grid view" title="Grid view">
      <span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
